openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: parties
    description: Customer and supplier directory
  - name: ledger
    description: Ledger entries (You Gave / You Got transactions)
  - name: dashboard
    description: Aggregated balance dashboard
  - name: settings
    description: Business settings
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: admin
    description: Admin console operations
  - name: auth
    description: Phone OTP authentication and signed-in identity
paths:
  /scan/bengali-ledger:
    post:
      operationId: scanBengaliLedger
      tags: [ledger]
      summary: Scan ledger image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/BengaliLedgerScanInput"
      responses:
        "200":
          description: Recognized entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BengaliLedgerScanResult"
  /scan/bulk-save:
    post:
      operationId: bulkSaveBengaliLedger
      tags: [ledger]
      summary: Save reviewed scan entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BengaliLedgerBulkSaveInput"
      responses:
        "200":
          description: Number saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BengaliLedgerBulkSaveResult"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/phone/send-otp:
    post:
      operationId: sendPhoneOtp
      tags: [auth]
      summary: Send a phone sign-in code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneOtpSendInput"
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneOtpSendResult"
        "400":
          description: Invalid phone number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: OTP temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/phone/verify-otp:
    post:
      operationId: verifyPhoneOtp
      tags: [auth]
      summary: Verify a phone sign-in code and issue a bearer session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneOtpVerifyInput"
      responses:
        "200":
          description: Signed-in phone session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneOtpSession"
        "401":
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Account access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: OTP temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/phone/logout:
    post:
      operationId: logoutPhoneOtp
      tags: [auth]
      summary: Revoke the current phone bearer session
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneOtpLogoutResult"
  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Get the current user's business identity and permissions
      responses:
        "200":
          description: Signed-in identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMe"
        "401":
          description: Invalid or revoked session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get aggregated dashboard totals
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /settings:
    get:
      operationId: getBusinessSettings
      tags: [settings]
      summary: Get business settings
      responses:
        "200":
          description: Business settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessSettings"
    patch:
      operationId: updateBusinessSettings
      tags: [settings]
      summary: Update business settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessSettingsUpdate"
      responses:
        "200":
          description: Updated business settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessSettings"
  /adjustment-targets:
    get:
      operationId: listAdjustmentTargets
      tags: [parties]
      summary: List authorized adjustment counterparties (identity only; no ledger access)
      responses:
        "200":
          description: Minimal counterparty identities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdjustmentTarget"
  /parties:
    get:
      operationId: listParties
      tags: [parties]
      summary: List parties (customers or suppliers)
      parameters:
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/PartyRole"
        - name: search
          in: query
          schema:
            type: string
        - name: dueFilter
          in: query
          schema:
            $ref: "#/components/schemas/DueFilter"
      responses:
        "200":
          description: List of parties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Party"
    post:
      operationId: createParty
      tags: [parties]
      summary: Create a new customer or supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartyInput"
      responses:
        "201":
          description: Created party
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Party"
  /parties/{partyId}:
    get:
      operationId: getParty
      tags: [parties]
      summary: Get a single party
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Party
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Party"
        "404":
          description: Not found
    delete:
      operationId: deleteParty
      tags: [parties]
      summary: Delete a party and all of its ledger entries
      description: Permanently removes the party plus any related ledger entries (cascade).
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletePartyResult"
        "404":
          description: Not found
  /parties/{partyId}/ledger-entries:
    get:
      operationId: listLedgerEntries
      tags: [ledger]
      summary: List ledger entries for a party
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of ledger entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LedgerEntry"
    post:
      operationId: createLedgerEntry
      tags: [ledger]
      summary: Record a "You Gave" or "You Got" transaction for a party
      description: Creates the ledger entry and recalculates the party's balance and balance type. A stable clientRequestId makes retries safe within the authenticated actor and business. Reuse with a different payload returns 409. Permissions are checked again on every replay.
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LedgerEntryInput"
      responses:
        "201":
          description: Created ledger entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerEntry"
        "200":
          description: Idempotent replay of the original source entry without creating another entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerEntry"
        "409":
          description: Request ID already used for different entry data
        "404":
          description: Not found
  /parties/{partyId}/ledger-entries/{entryId}:
    patch:
      operationId: patchLedgerEntry
      tags: [ledger]
      summary: Partially update a ledger entry
      parameters:
        - { name: partyId, in: path, required: true, schema: { type: string } }
        - { name: entryId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LedgerEntryPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerEntry"
  /parties/{partyId}/entries/{entryId}:
    delete:
      operationId: deleteLedgerEntry
      tags: [ledger]
      summary: Delete a ledger entry and its linked transfer entry
      parameters:
        - { name: partyId, in: path, required: true, schema: { type: string } }
        - { name: entryId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
  /ledger-entries:
    get:
      operationId: listGlobalLedgerEntries
      tags: [ledger]
      summary: List ledger entries across all parties
      description: Supports filtering by transaction date range and a free-text search across party name, phone, and entry description. Used by the global transaction report screen.
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of ledger entries across all parties, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GlobalLedgerEntry"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  # ── Admin endpoints ──────────────────────────────────────────────────────────
  /admin/auth/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: JWT token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResult"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Platform-wide statistics
      security:
        - adminBearer: []
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all app users
      security:
        - adminBearer: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersPage"

  /admin/users/{userId}:
    get:
      operationId: getAdminUser
      tags: [admin]
      summary: Get a single user with full detail
      security:
        - adminBearer: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "404":
          description: Not found
    patch:
      operationId: updateAdminUser
      tags: [admin]
      summary: Suspend or reactivate a user
      security:
        - adminBearer: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "404":
          description: Not found

  /admin/otp-config:
    get:
      operationId: getAdminOtpConfig
      tags: [admin]
      summary: Get OTP gateway configuration
      security:
        - adminBearer: []
      responses:
        "200":
          description: OTP config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOtpConfig"
    put:
      operationId: updateAdminOtpConfig
      tags: [admin]
      summary: Update OTP gateway configuration
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminOtpConfigInput"
      responses:
        "200":
          description: Updated OTP config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOtpConfig"

  /admin/blocked-ips:
    get:
      operationId: listBlockedIps
      tags: [admin]
      security:
        - adminBearer: []
      responses:
        "200":
          description: Blocked network addresses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockedIpsPage"
    post:
      operationId: blockIp
      tags: [admin]
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IpBlockInput"
      responses:
        "201":
          description: Network IP blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IpBlockResult"
  /admin/blocked-ips/{ip}:
    delete:
      operationId: unblockIp
      tags: [admin]
      security:
        - adminBearer: []
      parameters:
        - name: ip
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: IP unblocked

  /auth/presence:
    post:
      operationId: reportForegroundPresence
      tags: [auth]
      summary: Refresh authenticated foreground presence (five-minute window)
      responses:
        "204":
          description: Presence updated

  /parties/{partyId}/reminder:
    post:
      operationId: sendPaymentReminder
      tags: [parties]
      summary: Generate a mock payment reminder message
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Mock reminder message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderMessage"
        "404":
          description: Not found
components:
  schemas:
    BengaliLedgerScanInput:
      type: object
      required: [image]
      properties:
        image:
          type: string
          format: binary
    BengaliLedgerItem:
      type: object
      required: [partyId, partyName, extractedName, amount, type, note, confidence]
      properties:
        partyId: { type: ["string", "null"] }
        partyName: { type: string }
        extractedName: { type: string }
        amount: { type: number }
        type: { $ref: "#/components/schemas/LedgerEntryType" }
        note: { type: string }
        confidence: { type: string, enum: [high, medium, low] }
    BengaliLedgerScanResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BengaliLedgerItem" }
    BengaliLedgerBulkEntry:
      type: object
      required: [partyId, amount, type]
      properties:
        partyId: { type: string }
        amount: { type: number }
        type: { $ref: "#/components/schemas/LedgerEntryType" }
        note: { type: string }
    BengaliLedgerBulkSaveInput:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/BengaliLedgerBulkEntry" }
    BengaliLedgerBulkSaveResult:
      type: object
      required: [count]
      properties:
        count: { type: integer }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PhoneOtpSendInput:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          description: Bangladeshi phone number in 01XXXXXXXXX format.
    PhoneOtpSendResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
    PhoneOtpVerifyInput:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
        code:
          type: string
          minLength: 6
          maxLength: 6
    PhoneOtpSession:
      type: object
      required: [success, userId, businessId, phone, token]
      properties:
        success:
          type: boolean
        userId:
          type: string
        businessId:
          type: string
        phone:
          type: string
        token:
          type: string
          description: App-issued bearer token. Store in secure native storage.
    PhoneOtpLogoutResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
    AuthMe:
      type: object
      required: [role, businessId, userId, businessName, authMethod, adjustmentPartyIds]
      properties:
        role:
          type: string
          enum: [owner, staff]
        businessId:
          type: string
        userId:
          type: string
        businessName:
          type: string
        authMethod:
          type: string
          enum: [phone, clerk]
        adjustmentPartyIds:
          type: array
          items:
            type: string
        phone:
          type: string
    PartyRole:
      type: string
      enum: [CUSTOMER, SUPPLIER]
    BalanceType:
      type: string
      enum: [YOU_WILL_GIVE, YOU_WILL_GET]
    DueFilter:
      type: string
      enum: [ALL, DUE_TODAY, UPCOMING, NO_DUE_DATE]
    LedgerEntryType:
      type: string
      enum: [YOU_GAVE, YOU_GOT]
    AdjustmentTarget:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/PartyRole"
    Party:
      type: object
      required:
        - id
        - name
        - phone
        - role
        - currentBalance
        - balanceType
        - dueDate
        - lastTransactionAt
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        role:
          $ref: "#/components/schemas/PartyRole"
        currentBalance:
          type: number
        balanceType:
          $ref: "#/components/schemas/BalanceType"
        dueDate:
          type: ["string", "null"]
          format: date
        lastTransactionAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    PartyInput:
      type: object
      required:
        - name
        - role
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
          description: Optional mobile number; may be omitted or blank.
        role:
          $ref: "#/components/schemas/PartyRole"
        openingBalance:
          type: number
          description: Optional opening balance amount (always positive)
        openingBalanceType:
          $ref: "#/components/schemas/BalanceType"
        dueDate:
          type: ["string", "null"]
          format: date
    LedgerEntry:
      type: object
      required:
        - id
        - partyId
        - type
        - amount
        - description
        - billReference
        - billImage
        - dueDate
        - createdAt
      properties:
        id:
          type: string
        partyId:
          type: string
        type:
          $ref: "#/components/schemas/LedgerEntryType"
        amount:
          type: number
        description:
          type: string
        billReference:
          type: ["string", "null"]
        billImage:
          type: ["string", "null"]
          description: Scanned bill/receipt image stored as a cloud storage object path (e.g. /objects/uploads/uuid). Legacy rows may hold a base64 data URL during migration.
        dueDate:
          type: ["string", "null"]
          format: date
        createdAt:
          type: string
          format: date-time
        isTransfer:
          type: boolean
        transferPartyId:
          type: ["string", "null"]
        linkedEntryId:
          type: ["string", "null"]
    LedgerEntryInput:
      type: object
      required:
        - type
        - amount
      properties:
        clientRequestId:
          type: string
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          description: Stable UUID for retry-safe creation. Scoped to the authenticated actor and business.
        type:
          $ref: "#/components/schemas/LedgerEntryType"
        amount:
          type: number
          exclusiveMinimum: 0
        description:
          type: string
        billReference:
          type: ["string", "null"]
        billImage:
          type: ["string", "null"]
          description: Cloud storage object path for the scanned bill/receipt image (e.g. /objects/uploads/uuid).
        entryDate:
          type: ["string", "null"]
          format: date
          description: Optional transaction date. Stored as the entry timestamp at midnight UTC.
        dueDate:
          type: ["string", "null"]
          format: date
        isTransfer:
          type: boolean
        transferPartyId:
          type: ["string", "null"]
    LedgerEntryPatch:
      type: object
      properties:
        type: { $ref: "#/components/schemas/LedgerEntryType" }
        amount: { type: number, exclusiveMinimum: 0 }
        description: { type: string }
        billReference: { type: ["string", "null"] }
        billImage: { type: ["string", "null"] }
        entryDate: { type: ["string", "null"], format: date }
        dueDate: { type: ["string", "null"], format: date }
    DashboardSummary:
      type: object
      required:
        - youWillGet
        - youWillGive
        - onlineCollectionBalance
        - customerCount
        - supplierCount
      properties:
        youWillGet:
          type: number
        youWillGive:
          type: number
        onlineCollectionBalance:
          type: number
        customerCount:
          type: integer
        supplierCount:
          type: integer
    BusinessSettings:
      type: object
      required:
        - id
        - storeName
        - language
        - onlineCollectionBalance
      properties:
        id:
          type: string
        storeName:
          type: string
        language:
          type: string
        onlineCollectionBalance:
          type: number
    BusinessSettingsUpdate:
      type: object
      properties:
        storeName:
          type: string
          minLength: 1
        language:
          type: string
          minLength: 1
        onlineCollectionBalance:
          type: number
    ReminderMessage:
      type: object
      required:
        - message
        - partyName
        - amount
      properties:
        message:
          type: string
        partyName:
          type: string
        amount:
          type: number
    GlobalLedgerEntry:
      type: object
      required:
        - id
        - partyId
        - partyName
        - partyPhone
        - type
        - amount
        - description
        - billReference
        - billImage
        - dueDate
        - createdAt
      properties:
        id:
          type: string
        partyId:
          type: string
        partyName:
          type: string
        partyPhone:
          type: string
        type:
          $ref: "#/components/schemas/LedgerEntryType"
        amount:
          type: number
        description:
          type: string
        billReference:
          type: ["string", "null"]
        billImage:
          type: ["string", "null"]
          description: Cloud storage object path for the scanned bill/receipt image (e.g. /objects/uploads/uuid).
        dueDate:
          type: ["string", "null"]
          format: date
        createdAt:
          type: string
          format: date-time
    DeletePartyResult:
      type: object
      required:
        - success
        - id
      properties:
        success:
          type: boolean
        id:
          type: string
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `image/jpeg`).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          description: Presigned or signed API URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`). Store this in your database.
        uploadToken:
          type: string
          description: Optional short-lived Bearer capability for local-disk uploads.
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # ── Admin schemas ─────────────────────────────────────────────────────────
    LoginSource:
      type: string
      enum: [play_store, app_store, web]

    AuthProvider:
      type: string
      enum: [phone_otp, clerk]

    AdminLoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AdminLoginResult:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time

    AdminStats:
      type: object
      required: [totalUsers, activeUsers, newUsersToday, newUsersThisWeek, trends]
      properties:
        totalUsers:
          type: integer
        activeUsers:
          type: integer
        newUsersToday:
          type: integer
        newUsersThisWeek:
          type: integer
        trends:
          type: array
          items:
            $ref: "#/components/schemas/AdminTrendDay"

    AdminTrendDay:
      type: object
      required: [date, signups, logins]
      properties:
        date: { type: string, format: date }
        signups: { type: integer }
        logins: { type: integer }

    AdminUser:
      type: object
      required:
        - id
        - name
        - email
        - phone
        - authProvider
        - status
        - isOnline
        - createdAt
        - lastLogin
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        authProvider:
          $ref: "#/components/schemas/AuthProvider"
        status:
          type: string
          enum: [active, suspended]
        isOnline:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastLogin:
          type: ["string", "null"]
          format: date-time

    AdminUserDetail:
      allOf:
        - $ref: "#/components/schemas/AdminUser"
        - type: object
          required: [loginHistory]
          properties:
            loginHistory:
              type: array
              items:
                $ref: "#/components/schemas/AdminLoginEvent"

    AdminLoginEvent:
      type: object
      required: [id, occurredAt, ip, device, authMethod, source]
      properties:
        id: { type: string }
        occurredAt: { type: string, format: date-time }
        ip:
          type: ["string", "null"]
          description: Unavailable unless verified direct or trusted-proxy policy determines a real client IP. Historical values may reflect shared proxies.
        device: { type: string }
        authMethod: { type: string }
        source: { type: string }

    AdminUserUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, suspended]

    AdminUsersPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    AdminOtpConfig:
      type: object
      required: [enabled, provider, apiKeyConfigured, updatedAt, connectionError]
      properties:
        enabled: { type: boolean }
        provider:
          type: string
          enum: ["sms.net.bd"]
        apiKeyConfigured: { type: boolean }
        updatedAt:
          type: ["string", "null"]
          format: date-time
        connectionError: { type: ["string", "null"] }

    AdminOtpConfigInput:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    IpBlockInput:
      type: object
      required: [ip]
      properties:
        ip: { type: string }
        reason: { type: string }
    IpBlockResult:
      type: object
      required: [ip]
      properties:
        ip: { type: string }
    BlockedIp:
      type: object
      required: [ip, reason, createdAt]
      properties:
        ip: { type: string }
        reason: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    BlockedIpsPage:
      type: object
      required: [items, policy]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BlockedIp" }
        policy:
          $ref: "#/components/schemas/ClientIpPolicy"
    ClientIpPolicy:
      type: object
      required: [configured, mode, clientIpAvailable, message]
      properties:
        configured: { type: boolean }
        mode: { type: string, enum: [trusted_proxy, direct, setup_required] }
        clientIpAvailable: { type: boolean }
        message: { type: string }

  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
