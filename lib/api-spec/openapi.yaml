openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: parties
    description: Customer and supplier directory
  - name: ledger
    description: Ledger entries (You Gave / You Got transactions)
  - name: dashboard
    description: Aggregated balance dashboard
  - name: settings
    description: Business settings
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: admin
    description: Admin console operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get aggregated dashboard totals
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /settings:
    get:
      operationId: getBusinessSettings
      tags: [settings]
      summary: Get business settings
      responses:
        "200":
          description: Business settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessSettings"
    patch:
      operationId: updateBusinessSettings
      tags: [settings]
      summary: Update business settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessSettingsUpdate"
      responses:
        "200":
          description: Updated business settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessSettings"
  /parties:
    get:
      operationId: listParties
      tags: [parties]
      summary: List parties (customers or suppliers)
      parameters:
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/PartyRole"
        - name: search
          in: query
          schema:
            type: string
        - name: dueFilter
          in: query
          schema:
            $ref: "#/components/schemas/DueFilter"
      responses:
        "200":
          description: List of parties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Party"
    post:
      operationId: createParty
      tags: [parties]
      summary: Create a new customer or supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartyInput"
      responses:
        "201":
          description: Created party
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Party"
  /parties/{partyId}:
    get:
      operationId: getParty
      tags: [parties]
      summary: Get a single party
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Party
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Party"
        "404":
          description: Not found
    delete:
      operationId: deleteParty
      tags: [parties]
      summary: Delete a party and all of its ledger entries
      description: Permanently removes the party plus any related ledger entries (cascade).
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletePartyResult"
        "404":
          description: Not found
  /parties/{partyId}/ledger-entries:
    get:
      operationId: listLedgerEntries
      tags: [ledger]
      summary: List ledger entries for a party
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of ledger entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LedgerEntry"
    post:
      operationId: createLedgerEntry
      tags: [ledger]
      summary: Record a "You Gave" or "You Got" transaction for a party
      description: Creates the ledger entry and recalculates the party's balance and balance type.
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LedgerEntryInput"
      responses:
        "201":
          description: Created ledger entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerEntry"
        "404":
          description: Not found
  /ledger-entries:
    get:
      operationId: listGlobalLedgerEntries
      tags: [ledger]
      summary: List ledger entries across all parties
      description: Supports filtering by transaction date range and a free-text search across party name, phone, and entry description. Used by the global transaction report screen.
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of ledger entries across all parties, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GlobalLedgerEntry"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  # ── Admin endpoints ──────────────────────────────────────────────────────────
  /admin/auth/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: JWT token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResult"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Platform-wide statistics
      security:
        - adminBearer: []
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all app users
      security:
        - adminBearer: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: loginSource
          in: query
          schema:
            $ref: "#/components/schemas/LoginSource"
        - name: authProvider
          in: query
          schema:
            $ref: "#/components/schemas/AuthProvider"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersPage"

  /admin/users/{userId}:
    get:
      operationId: getAdminUser
      tags: [admin]
      summary: Get a single user with full detail
      security:
        - adminBearer: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "404":
          description: Not found
    patch:
      operationId: updateAdminUser
      tags: [admin]
      summary: Suspend or reactivate a user
      security:
        - adminBearer: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "404":
          description: Not found

  /admin/businesses:
    get:
      operationId: listAdminBusinesses
      tags: [admin]
      summary: List all businesses / shops
      security:
        - adminBearer: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated businesses list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBusinessesPage"

  /admin/transactions:
    get:
      operationId: listAdminTransactions
      tags: [admin]
      summary: Global ledger entries across all businesses
      security:
        - adminBearer: []
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTransactionsPage"

  /admin/otp-config:
    get:
      operationId: getAdminOtpConfig
      tags: [admin]
      summary: Get OTP gateway configuration
      security:
        - adminBearer: []
      responses:
        "200":
          description: OTP config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOtpConfig"
    put:
      operationId: updateAdminOtpConfig
      tags: [admin]
      summary: Update OTP gateway configuration
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminOtpConfigInput"
      responses:
        "200":
          description: Updated OTP config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOtpConfig"

  /parties/{partyId}/reminder:
    post:
      operationId: sendPaymentReminder
      tags: [parties]
      summary: Generate a mock payment reminder message
      parameters:
        - name: partyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Mock reminder message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderMessage"
        "404":
          description: Not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PartyRole:
      type: string
      enum: [CUSTOMER, SUPPLIER]
    BalanceType:
      type: string
      enum: [YOU_WILL_GIVE, YOU_WILL_GET]
    DueFilter:
      type: string
      enum: [ALL, DUE_TODAY, UPCOMING, NO_DUE_DATE]
    LedgerEntryType:
      type: string
      enum: [YOU_GAVE, YOU_GOT]
    Party:
      type: object
      required:
        - id
        - name
        - phone
        - role
        - currentBalance
        - balanceType
        - dueDate
        - lastTransactionAt
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        role:
          $ref: "#/components/schemas/PartyRole"
        currentBalance:
          type: number
        balanceType:
          $ref: "#/components/schemas/BalanceType"
        dueDate:
          type: ["string", "null"]
          format: date
        lastTransactionAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    PartyInput:
      type: object
      required:
        - name
        - role
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
          description: Optional mobile number; may be omitted or blank.
        role:
          $ref: "#/components/schemas/PartyRole"
        openingBalance:
          type: number
          description: Optional opening balance amount (always positive)
        openingBalanceType:
          $ref: "#/components/schemas/BalanceType"
        dueDate:
          type: ["string", "null"]
          format: date
    LedgerEntry:
      type: object
      required:
        - id
        - partyId
        - type
        - amount
        - description
        - billReference
        - billImage
        - dueDate
        - createdAt
      properties:
        id:
          type: string
        partyId:
          type: string
        type:
          $ref: "#/components/schemas/LedgerEntryType"
        amount:
          type: number
        description:
          type: string
        billReference:
          type: ["string", "null"]
        billImage:
          type: ["string", "null"]
          description: Scanned bill/receipt image stored as a cloud storage object path (e.g. /objects/uploads/uuid). Legacy rows may hold a base64 data URL during migration.
        dueDate:
          type: ["string", "null"]
          format: date
        createdAt:
          type: string
          format: date-time
    LedgerEntryInput:
      type: object
      required:
        - type
        - amount
      properties:
        type:
          $ref: "#/components/schemas/LedgerEntryType"
        amount:
          type: number
          exclusiveMinimum: 0
        description:
          type: string
        billReference:
          type: ["string", "null"]
        billImage:
          type: ["string", "null"]
          description: Cloud storage object path for the scanned bill/receipt image (e.g. /objects/uploads/uuid).
        dueDate:
          type: ["string", "null"]
          format: date
    DashboardSummary:
      type: object
      required:
        - youWillGet
        - youWillGive
        - onlineCollectionBalance
        - customerCount
        - supplierCount
      properties:
        youWillGet:
          type: number
        youWillGive:
          type: number
        onlineCollectionBalance:
          type: number
        customerCount:
          type: integer
        supplierCount:
          type: integer
    BusinessSettings:
      type: object
      required:
        - id
        - storeName
        - language
        - onlineCollectionBalance
      properties:
        id:
          type: string
        storeName:
          type: string
        language:
          type: string
        onlineCollectionBalance:
          type: number
    BusinessSettingsUpdate:
      type: object
      properties:
        storeName:
          type: string
          minLength: 1
        language:
          type: string
          minLength: 1
        onlineCollectionBalance:
          type: number
    ReminderMessage:
      type: object
      required:
        - message
        - partyName
        - amount
      properties:
        message:
          type: string
        partyName:
          type: string
        amount:
          type: number
    GlobalLedgerEntry:
      type: object
      required:
        - id
        - partyId
        - partyName
        - partyPhone
        - type
        - amount
        - description
        - billReference
        - billImage
        - dueDate
        - createdAt
      properties:
        id:
          type: string
        partyId:
          type: string
        partyName:
          type: string
        partyPhone:
          type: string
        type:
          $ref: "#/components/schemas/LedgerEntryType"
        amount:
          type: number
        description:
          type: string
        billReference:
          type: ["string", "null"]
        billImage:
          type: ["string", "null"]
          description: Cloud storage object path for the scanned bill/receipt image (e.g. /objects/uploads/uuid).
        dueDate:
          type: ["string", "null"]
          format: date
        createdAt:
          type: string
          format: date-time
    DeletePartyResult:
      type: object
      required:
        - success
        - id
      properties:
        success:
          type: boolean
        id:
          type: string
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `image/jpeg`).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`). Store this in your database.
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # ── Admin schemas ─────────────────────────────────────────────────────────
    LoginSource:
      type: string
      enum: [play_store, app_store, web]

    AuthProvider:
      type: string
      enum: [phone_otp, gmail]

    AdminLoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AdminLoginResult:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time

    AdminStats:
      type: object
      required:
        - totalUsers
        - totalBusinesses
        - totalTransactions
        - totalTransactionVolume
        - newUsersToday
        - newUsersThisWeek
        - activeUsersThisMonth
        - usersByLoginSource
        - usersByAuthProvider
      properties:
        totalUsers:
          type: integer
        totalBusinesses:
          type: integer
        totalTransactions:
          type: integer
        totalTransactionVolume:
          type: number
        newUsersToday:
          type: integer
        newUsersThisWeek:
          type: integer
        activeUsersThisMonth:
          type: integer
        usersByLoginSource:
          type: object
          additionalProperties:
            type: integer
        usersByAuthProvider:
          type: object
          additionalProperties:
            type: integer

    AdminUser:
      type: object
      required:
        - id
        - name
        - phone
        - loginSource
        - authProvider
        - deviceMeta
        - status
        - businessCount
        - createdAt
        - lastLogin
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        loginSource:
          $ref: "#/components/schemas/LoginSource"
        authProvider:
          $ref: "#/components/schemas/AuthProvider"
        deviceMeta:
          type: string
        status:
          type: string
          enum: [active, suspended]
        businessCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        lastLogin:
          type: ["string", "null"]
          format: date-time

    AdminUserDetail:
      allOf:
        - $ref: "#/components/schemas/AdminUser"
        - type: object
          required: [businesses]
          properties:
            businesses:
              type: array
              items:
                $ref: "#/components/schemas/AdminBusinessSummary"

    AdminUserUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, suspended]

    AdminUsersPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    AdminBusinessSummary:
      type: object
      required: [id, name, partyCount, ledgerCount, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        partyCount:
          type: integer
        ledgerCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    AdminBusiness:
      type: object
      required: [id, name, ownerName, ownerPhone, partyCount, ledgerCount, transactionVolume, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        ownerName:
          type: string
        ownerPhone:
          type: string
        partyCount:
          type: integer
        ledgerCount:
          type: integer
        transactionVolume:
          type: number
        createdAt:
          type: string
          format: date-time

    AdminBusinessesPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminBusiness"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    AdminTransaction:
      type: object
      required: [id, businessName, partyName, partyPhone, type, amount, description, createdAt]
      properties:
        id:
          type: string
        businessName:
          type: string
        partyName:
          type: string
        partyPhone:
          type: string
        type:
          $ref: "#/components/schemas/LedgerEntryType"
        amount:
          type: number
        description:
          type: string
        createdAt:
          type: string
          format: date-time

    AdminTransactionsPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminTransaction"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    AdminOtpConfig:
      type: object
      required: [gatewayUrl, apiKeyHint, remainingBalance, updatedAt]
      properties:
        gatewayUrl:
          type: string
        apiKeyHint:
          type: string
          description: Last 4 chars of key only — never expose the full key
        remainingBalance:
          type: integer
        updatedAt:
          type: ["string", "null"]
          format: date-time

    AdminOtpConfigInput:
      type: object
      required: [gatewayUrl, apiKey, remainingBalance]
      properties:
        gatewayUrl:
          type: string
        apiKey:
          type: string
        remainingBalance:
          type: integer
          minimum: 0

  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
