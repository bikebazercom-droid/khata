plugins {
    id 'com.android.application'
}

android {
    namespace 'com.banglakhata.webview'
    compileSdk 35
    defaultConfig {
        applicationId 'com.banglakhata.webview'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'WEB_APP_URL', '"https://hazarikhata.replit.app/"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // AndroidX brings Kotlin runtime dependencies even in a Java-only app.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.13.1'
}