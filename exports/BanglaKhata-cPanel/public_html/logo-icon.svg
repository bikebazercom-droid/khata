  <polyline points="50,62 57,49 63,55 70,39 79,45" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- Orange trending arrow -->
  <line x1="70" y1="40" x2="83" y2="21" stroke="#F5A623" stroke-width="3" stroke-linecap="round"/>
  <path d="M83,21 L76,25 M83,21 L80,29" fill="none" stroke="#F5A623" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Book spine -->
  <line x1="44" y1="22" x2="44" y2="78" stroke="#0D2040" stroke-width="1.5" opacity="0.4"/>
</svg>
