kind = "mobile"
previewPath = "/mobile/"
title = "Hazari Khatabook Mobile"
version = "1.0.0"
id = "artifacts/khatabook-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 24238

[services.development]
run = "pnpm --filter @workspace/khatabook-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/khatabook-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/khatabook-mobile", "run", "serve" ]

[services.env]
PORT = "24238"
BASE_PATH = "/mobile/"
