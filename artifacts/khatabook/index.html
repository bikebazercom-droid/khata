      // Suppress errors thrown by browser extensions (e.g. MetaMask)
      // so they don't appear in Vite's runtime-error overlay.
      window.addEventListener('error', function (e) {
        if (e.filename && e.filename.startsWith('chrome-extension://')) {
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
